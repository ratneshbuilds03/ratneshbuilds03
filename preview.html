<!doctype html>
<meta charset="utf-8">
<title>Ratnesh — GitHub profile visual preview</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; padding:32px; background:#050816; color:#e2e8f0; font:15px/1.5 system-ui,sans-serif; }
  h1 { color:#67e8f9; font-size:22px; }
  h2 { color:#94a3b8; font:12px ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; margin:36px 0 14px; }
  .card { background:#0b1020; border:1px solid #263452; border-radius:18px; padding:18px; max-width:1180px; }
  img { display:block; max-width:100%; height:auto; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
</style>
<h1>Ratnesh — profile visual preview</h1>
<div class="card"><img src="assets/hero-3d.svg" alt="Hero"></div>
<h2>Architecture</h2>
<div class="card"><img src="assets/architecture-3d.svg" alt="Architecture"></div>
<h2>Stack</h2>
<div class="card"><img src="assets/stack-3d.svg" alt="Stack"></div>
<h2>Signals</h2>
<div class="grid">
  <div class="card"><img src="assets/radar-dark.svg" alt="Backend radar"></div>
  <div class="card"><img src="assets/radar-langs-dark.svg" alt="Stack radar"></div>
</div>
